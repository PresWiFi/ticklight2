name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      url:
        description: "Pre-fill the server address (optional)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Same key every build, so updates install over the old app
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TICKLIGHT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; using a throwaway debug key"
          fi
      - run: gradle assembleRelease -PticklightUrl="${{ inputs.url }}"
        env:
          TICKLIGHT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk ticklight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ticklight-android
          path: android/ticklight.apk
      # Stable download link: .../releases/download/android-latest/ticklight.apk
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest)" \
              --notes "Built from main. Install ticklight.apk on your phone."
          gh release upload android-latest ticklight.apk --clobber
          gh release edit android-latest --notes "Built from main at ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). Install ticklight.apk on your phone."
