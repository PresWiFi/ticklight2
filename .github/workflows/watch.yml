name: Build watch app

on:
  push:
    paths: ["watch/**", ".github/workflows/watch.yml"]
  workflow_dispatch:
    inputs:
      url:
        description: "Pre-fill the server address (optional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK (ANDROID_HOME); Gradle fetches missing platforms
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleRelease -PticklightUrl="${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ticklight-watch
          path: watch/app/build/outputs/apk/release/*.apk
